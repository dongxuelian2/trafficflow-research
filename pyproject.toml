[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficflow-research"
version = "0.1.0"
description = "Independent reproducible four-task TrafficFlowBench research system"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<4", "scipy>=1.16,<2", "pyarrow>=20", "lightgbm==4.7.0", "catboost==1.2.10", "scikit-learn==1.7.2", "requests>=2.32"]

[project.scripts]
trafficflow = "trafficflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
